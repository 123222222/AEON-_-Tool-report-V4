<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thống kê lỗi AEON - Full Screen</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    body {
      background: #ffffff;
      color: #0f172a;
      margin: 0;
      padding: 10px;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }
    .charts-grid {
      display: grid;
      grid-template-columns: 1.05fr 1fr 1fr;
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 15px;
      height: calc(100vh - 60px);
      width: 100%;
    }
    .chart-box {
      background: #ffffff;
      border: 1px solid #b9d7f2;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
    }
    .chart-box.total-box {
      grid-row: 1 / span 2;
    }
    .chart-box h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      text-align: center;
      color: #065795;
      /* color: #065795; */
      font-weight: 700;
    }
    .chart-canvas-wrapper {
      flex: 1;
      position: relative;
      min-height: 0;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px 10px 10px;
    }
    .header h1 {
      margin: 0;
      font-size: 18px;
      color: #0f172a;
    }
    .btn-back {
      padding: 6px 15px;
      /* background: #1d7fd1;  */
      background: #a22303;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(29, 127, 209, 0.25);
    }
    /* Empty box style */
    .empty-box {
        display: flex;
        align-items: center;
        justify-content: center;
      color: #64748b;
        font-style: italic;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1> ALARM ALL SITE</h1>
    <button class="btn-back" onclick="window.close(); if(window.opener){window.opener.focus();} else {window.history.back();}">Đóng / Quay lại</button>
  </div>

  <div class="charts-grid">
    <div class="chart-box total-box">
      <h3>ALARM TOTAL (YTD)</h3>
      <div class="chart-canvas-wrapper"><canvas id="chart-total"></canvas></div>
    </div>
    <div class="chart-box">
      <h3>WEEK 1</h3>
      <div class="chart-canvas-wrapper"><canvas id="chart-week1"></canvas></div>
    </div>
    <div class="chart-box">
      <h3>WEEK 2</h3>
      <div class="chart-canvas-wrapper"><canvas id="chart-week2"></canvas></div>
    </div>
    <div class="chart-box">
      <h3>WEEK 3</h3>
      <div class="chart-canvas-wrapper"><canvas id="chart-week3"></canvas></div>
    </div>
    <div class="chart-box">
      <h3>WEEK 4</h3>
      <div class="chart-canvas-wrapper"><canvas id="chart-week4"></canvas></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const API = window.location.origin;
    let chartInstances = {}; // Khai báo ở phạm vi toàn cục

    async function initCharts() {
      console.log("initCharts called at", new Date().toLocaleTimeString());
      // Destroy existing charts before rendering new ones
      Object.values(chartInstances).forEach(chart => chart.destroy());
      chartInstances = {};
      try {
        const res = await fetch(API + "/api/charts/data");
        const data = await res.json();
        renderAll(data);
      } catch (e) {
        console.error("Lỗi tải dữ liệu:", e);
      }
    }

    function renderAll(data) {
      const sites = Array.isArray(data.sites) ? data.sites : [];
      const summary = data.summary || {};
      const weekTotals = summary.week_totals || {};
      // const blueColor = '#1f77b4';
      const darkBlueColor = '#065795';

      const renderBarChart = (canvasId, labels, values, options = {}) => {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        chartInstances[canvasId] = new Chart(ctx, {
          type: 'bar',
          data: {
            labels,
            datasets: [{
              label: options.label || '',
              data: values,
              backgroundColor: options.backgroundColor || darkBlueColor,
              borderColor: options.borderColor || darkBlueColor,
              borderWidth: 1
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                display: options.showLegend ?? false,
                position: 'bottom',
                labels: { boxWidth: 10, color: '#64748b', font: { size: 10 } }
              },
              tooltip: { enabled: true }
            },
            scales: {
              y: {
                beginAtZero: true,
                ticks: { color: '#64748b', stepSize: 1 },
                grid: { color: 'rgba(148, 163, 184, 0.22)' },
                border: { color: 'rgba(148, 163, 184, 0.35)' }
              },
              x: {
                ticks: {
                  color: '#64748b',
                  callback: function(value) {
                    const label = this.getLabelForValue(value);
                    return String(label).split(' ');
                  }
                },
                grid: { color: 'rgba(148, 163, 184, 0.14)' },
                border: { color: 'rgba(148, 163, 184, 0.35)' }
              }
            }
          }
        });
      };

      renderBarChart(
        'chart-total',
        ['OVERALL'],
        [summary.overall_total || 0],
        { label: 'All Sites', backgroundColor: darkBlueColor, borderColor: darkBlueColor, showLegend: true }
      );

      [0, 1, 2, 3].forEach((index) => {
        const canvasId = `chart-week${index + 1}`;
        const values = sites.map(site => site.weeks?.[index] ?? 0);
        const labels = sites.map(site => site.site_name || site.code_site || '');
        renderBarChart(canvasId, labels, values, {
          label: `WEEK ${index + 1}`,
          backgroundColor: darkBlueColor,
          borderColor: darkBlueColor,
          showLegend: false
        });
      });
    }

    initCharts();
    setInterval(initCharts, 30 * 60 * 1000); // Tự động làm mới sau mỗi 30 phút
  </script>
</body>
</html>
